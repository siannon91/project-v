<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune Cookie Quotes</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/icon.png">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div class="app-container">
      <h1>Inspirational Fortune Cookie Quotes</h1>

      <div class="cookie-area">
        <div id="cookie-display" class="cookie-closed">
          <img src="/chiuso.png" alt="fortune cookie">
        </div>

        <div id="quote-paper" class="paper hidden">
          <p id="quote-text"></p>
        </div>
      </div>

      <button id="action-btn">Open Cookie</button>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
